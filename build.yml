# Mirror of .github/workflows/build.yml for github.com/mkdevofficial/Moaqit
name: Build and Package Mawaqit

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aarch64:
    name: Build & Package (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android ARM64 (aarch64) Release
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare Exclusive aarch64 Package
        run: |
          mkdir -p package_output
          
          # Locate the arm64 / aarch64 binary and package strictly as app-aarch64.qpk
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "package_output/app-aarch64.qpk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "package_output/app-aarch64.qpk"
          else
            echo "Searching for arm64 output..."
            ARM_FILE=$(find build/app/outputs -name "*arm64*.apk" | head -n 1)
            if [ -n "$ARM_FILE" ]; then
              cp "$ARM_FILE" "package_output/app-aarch64.qpk"
            else
              echo "Error: No arm64 binary produced."
              exit 1
            fi
          fi
          
          # Enforce that package_output has ONLY app-aarch64.qpk and no other file
          find package_output/ -type f ! -name 'app-aarch64.qpk' -delete
          
          echo "=== Verified Package Contents ==="
          ls -la package_output/
          test $(ls -1 package_output | wc -l) -eq 1

      - name: Upload Exclusive aarch64 Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawaqit-aarch64
          path: package_output/app-aarch64.qpk
          if-no-files-found: error
          compression-level: 6

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package_output/app-aarch64.qpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
